[package]
name = "omp-desktop"
version = "0.1.0"
description = "OMP Desktop — GUI shell over the omp coding agent (RPC sidecar)"
authors = ["TA-Mark"]
edition = "2021"

# Standalone crate: NOT part of the repo's Rust workspace (crates/pi-*).
# The empty [workspace] table makes this its own workspace root so `cargo`
# does not try to attach it to the top-level workspace.
[workspace]

[lib]
name = "omp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
