name: Desktop Release

# Electron Builder packages the React renderer and the OMP v17.0.1 sidecar.
# Signing and auto-update are intentionally optional; unsigned installers are
# still uploaded for local validation and manual distribution.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-14
            artifact: macos-arm64
          - os: macos-13
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (bun)
        uses: ./.github/actions/bun-install

      - name: Check desktop package
        shell: bash
        run: |
          bun --cwd=packages/desktop run check
          bun --cwd=packages/desktop run test

      - name: Build Electron installer
        shell: bash
        run: bun --cwd=packages/desktop run electron:build

      - name: Validate packaged Electron runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: bun --cwd=packages/desktop run release:validate

      - name: Validate MSI payload without installing
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msiItem = Get-ChildItem 'packages/desktop/release' -Filter '*.msi' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $msiItem) { throw 'Electron Builder did not produce an MSI artifact' }
          $msi = $msiItem.FullName
          $target = Join-Path $env:RUNNER_TEMP 'omp-desktop-msi'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $process = Start-Process msiexec.exe -ArgumentList @('/a', ('"' + $msi + '"'), '/qn', ('TARGETDIR="' + $target + '"')) -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw "MSI extraction failed: $($process.ExitCode)" }
          $exe = Get-ChildItem -LiteralPath $target -Recurse -Filter 'OMP Desktop.exe' | Select-Object -First 1
          if (-not $exe) { throw 'MSI payload does not contain OMP Desktop.exe' }
          bun packages/desktop/scripts/validate-packaged.ts $exe.FullName

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: omp-desktop-${{ matrix.artifact }}
          if-no-files-found: error
          path: packages/desktop/release/**

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/desktop/release/*

  contract-smoke:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies (bun)
        uses: ./.github/actions/bun-install
      - name: Build OMP sidecar
        shell: pwsh
        run: bun --cwd=packages/desktop run sidecar
      - name: Run source and sidecar RPC smoke tests
        shell: pwsh
        run: |
          bun --cwd=packages/desktop run smoke
          bun --cwd=packages/desktop run smoke --sidecar
