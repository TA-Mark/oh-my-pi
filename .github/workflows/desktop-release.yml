name: Desktop Release

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-14
            target: darwin-arm64
          - os: macos-13
            target: darwin-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/bun-install

      - name: Build engine sidecar
        shell: bash
        env:
          CROSS_TARGET: ${{ matrix.target }}
        run: bun --cwd=packages/desktop run sidecar

      - name: Build Electron installers
        shell: bash
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: bun --cwd=packages/desktop run electron:build

      - name: Validate packaged application
        shell: bash
        run: bun --cwd=packages/desktop run release:validate

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: omp-desktop-${{ matrix.target }}
          if-no-files-found: error
          path: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.msi
            packages/desktop/release/*.dmg

      - name: Attach installers to release
        if: startsWith(github.ref, 'refs/tags/desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/desktop/release/*.exe
            packages/desktop/release/*.msi
            packages/desktop/release/*.dmg
